<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUTU — Cape Town</title>
<meta name="description" content="LUTU is a Cape Town content studio. A new site is on the way. Reach us on WhatsApp or by email in the meantime.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LUTU — Cape Town">
<meta property="og:description" content="A Cape Town content studio. New site on the way.">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#1A1816;--sand:#E8DFD1;--sand-deep:#CDBFA8;--offwhite:#FAF7F2;--teal:#2F6B6B;
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  body{
    font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.7;
    color:var(--sand);background:var(--ink);
    min-height:100svh;display:flex;align-items:center;justify-content:center;
    padding:2rem 1.5rem;-webkit-font-smoothing:antialiased;
  }
  main{max-width:34rem;text-align:center}
  .brand{
    font-family:var(--serif);font-size:1.5rem;letter-spacing:.3em;text-transform:uppercase;
    color:var(--offwhite);margin-bottom:2.5rem;
  }
  .rule{width:1px;height:48px;background:linear-gradient(to bottom,transparent,var(--sand-deep));margin:0 auto 2.5rem}
  h1{
    font-family:var(--serif);font-weight:400;font-size:clamp(1.5rem,5vw,2.1rem);
    line-height:1.3;color:var(--offwhite);margin-bottom:1.25rem;text-wrap:balance;
  }
  p{color:var(--sand-deep);margin-bottom:2.5rem}
  .links{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center}
  a.btn{
    display:inline-block;font-size:.72rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
    padding:1rem 2rem;text-decoration:none;border:1px solid transparent;transition:background .2s,color .2s;
  }
  .btn--primary{background:var(--teal);color:#fff}
  .btn--primary:hover{background:#4A8F8C}
  .btn--ghost{color:var(--offwhite);border-color:rgba(250,247,242,.4)}
  .btn--ghost:hover{background:var(--offwhite);color:var(--ink)}
  a:focus-visible{outline:2px solid var(--sand-deep);outline-offset:3px}
  footer{margin-top:3.5rem;font-size:.72rem;color:#6B6358;line-height:1.8}
</style>
</head>
<body>
<main>
  <p class="brand">LUTU</p>
  <div class="rule"></div>
  <h1>A Cape Town content studio.</h1>
  <p>We shoot product and fashion content in Cape Town for brands in Saudi Arabia and the Gulf. A new site is on the way.</p>
  <div class="links">
    <a class="btn btn--primary" href="https://wa.me/27824617739?text=Hi%20LUTU">WhatsApp us</a>
    <a class="btn btn--ghost" href="mailto:lutu.official@gmail.com">Email us</a>
  </div>
  <footer>
    LUTU (Pty) Ltd &nbsp;·&nbsp; Cape Town, South Africa
  </footer>
</main>
</body>
</html>
